[package]
name = "cargo-xc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Build Rust for x86-64 and ARM64 GNU/Linux from an ARM64 host"
license = "MIT"
repository = "https://github.com/stevepryde/cargo-xc"
readme = "README.md"
keywords = ["cargo", "cross-compilation", "linux", "arm64", "amd64"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[[bin]]
name = "cargo-xc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
dirs = "6.0.0"
fs2 = "0.4.3"
goblin = "0.10.4"
hex = "0.4.3"
regex = "1.12.2"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "signal", "sync", "time"] }
toml = "0.9.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
